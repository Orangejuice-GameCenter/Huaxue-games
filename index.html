<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>元素反应实验室</title>
<style>
:root{--bg:#e9efe9;--panel:#f6f9f6;--ink:#1b2a38;--sub:#566873;--line:#c3d1ca;--acc:#1f6fd1;--hot:#d9651f;--stage:#dce6e0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101c26;--panel:#182a37;--ink:#e4eef0;--sub:#92a8b2;--line:#2c4352;--acc:#5aa2f5;--hot:#f08a45;--stage:#15303f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101c26;--panel:#182a37;--ink:#e4eef0;--sub:#92a8b2;--line:#2c4352;--acc:#5aa2f5;--hot:#f08a45;--stage:#15303f;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:8px}
h1{font:700 20px/1.2 "Songti SC","Noto Serif SC",Georgia,serif;margin:0}
#prog{font-size:12px;color:var(--sub)}
header button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
#stage{position:relative;flex:1;min-height:0;margin:0 8px;border-radius:16px;overflow:hidden;background:var(--stage) radial-gradient(var(--line) 1px,transparent 1.5px) 0 0/22px 22px;touch-action:none}
#stage.shake{animation:sh .45s}
@keyframes sh{0%,100%{transform:none}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
#banner{position:absolute;left:8px;right:8px;top:8px;z-index:30;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;opacity:0;transition:opacity .3s}
#banner.on{opacity:1}
#banner .eq{font:600 15px/1.4 Cambria,"Songti SC",Georgia,serif}
#banner em{font-style:normal;color:var(--hot)}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--sub);font-size:14px;pointer-events:none}
.tok{position:absolute;width:60px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel);color:var(--ink);overflow:hidden;font-family:Cambria,"Songti SC",Georgia,serif;line-height:1.1;text-align:center;touch-action:none;cursor:grab;z-index:5;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.tok span{font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none}.ic{width:28px;height:28px;flex:none;pointer-events:none}.mini .ic{width:36px;height:36px}
.tok small{font:400 9px system-ui,sans-serif;opacity:.85;white-space:nowrap;pointer-events:none}
.st-s{border-radius:9px;border:3px solid var(--ink)}
.st-l{border-radius:14px 14px 24px 24px;border:2.5px solid var(--acc)}
.st-g{border-radius:24px;border:2.5px dashed var(--sub);opacity:.9}.st-c{border-radius:18px;border:2.5px solid var(--hot)}
.tok.drag{z-index:15;transform:scale(1.12);box-shadow:0 8px 14px rgba(0,0,0,.3)}
.tok.hit{outline:4px solid var(--hot);outline-offset:2px}
.tok.nope{animation:sh .35s}
#shelf{background:var(--panel);border-top:1px solid var(--line);margin-top:8px;padding:6px 0 8px;transition:background .2s}
#shelf.del{background:#e8742c40}
#q{display:block;width:calc(100% - 20px);margin:0 10px 6px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;-webkit-user-select:text;user-select:text}#q:focus-visible{outline:3px solid var(--acc);outline-offset:1px}.none{grid-row:1/3;color:var(--sub);font-size:13px;padding:8px;white-space:nowrap}
#tabs{display:flex;gap:6px;padding:0 10px}
#tabs button{flex:1;font:inherit;font-size:13px;font-weight:600;color:var(--sub);background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:6px 0;cursor:pointer}
#tabs button.on{color:var(--ink);border-color:var(--ink)}
#row{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,72px);gap:6px;overflow-x:auto;padding:8px 12px 2px;-webkit-overflow-scrolling:touch}
.mini{position:relative;flex:none;width:62px;height:72px;touch-action:pan-x}
#tip{font-size:11px;color:var(--sub);padding:2px 12px 0}
#dexp{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
#dexp[hidden]{display:none}
#dexp div.box{background:var(--panel);width:100%;max-height:75%;overflow:auto;border-radius:16px 16px 0 0;padding:14px;user-select:text}
#dexp h2{font:600 16px "Songti SC",Georgia,serif;margin:0 0 8px}
#dexp p{margin:0 0 6px;font:14px/1.5 Cambria,"Songti SC",Georgia,serif;border-left:3px solid var(--acc);padding-left:8px}
#dexp button{margin-top:8px;font:inherit;width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header><div><h1>元素反应实验室</h1><div id="prog"></div></div><div><button id="dex">图鉴</button> <button id="clr">清空</button></div></header>

<div id="dexp" hidden><div class="box"><h2 id="dh"></h2><div id="dl"></div><button id="dc">关闭</button></div></div>

    if(s.st==='s'&&!r.L.includes(x[1]))for(let k=0;k<26;k++)pp('p',cx+(Math.random()-.5)*60,cy-10+Math.random()*20,0,.8+Math.random()*1.2,1.5+Math.random()*2.5,s.col,.012)});
  if(r.h){pp('g',cx,cy,0,0,110,'',.012);for(let k=0;k<8;k++)pp('p',cx+(Math.random()-.5)*50,cy,0,-.7,7,'rgba(190,200,205,.6)',.012)}
  if(r.f){for(let k=0;k<30;k++)pp('p',cx+(Math.random()-.5)*60,cy,(Math.random()-.5)*2,-(1.5+Math.random()*2.5),5+Math.random()*7,Math.random()<.5?'#ffb43c':'#e8641e',.03);st.classList.remove('shake');void st.offsetWidth;st.classList.add('shake')}
  const isNew=!found.has(i);found.add(i);
  try{localStorage.setItem('chem-found2',JSON.stringify([...found]))}catch(e){}
  say((isNew?'<b>新发现！</b> ':'')+'<div class="eq">'+r.eq+'</div><em>'+r.tags.join(' · ')+'</em>');
  prog();
}
// 试剂架
let tab='s',q='';const TN={s:'固体',l:'液体',g:'气体',c:'条件'};
function shelfUI(){
  $('#tabs').innerHTML=['s','l','g','c'].map(k=>'<button data-k="'+k+'" class="'+(!q&&k===tab?'on':'')+'">'+TN[k]+' '+Object.values(SP).filter(s=>s.st===k).length+'</button>').join('');
  row.innerHTML='';row.scrollLeft=0;
  Object.keys(SP).filter(id=>q?(id+SP[id].cn+fm(id)).toLowerCase().includes(q):SP[id].st===tab).forEach(id=>{
    const m=el(id);m.classList.add('mini');row.append(m);
    m.onpointerdown=e=>{
      const sx=e.clientX,sy=e.clientY;let done=0;
      const cl=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',upp);removeEventListener('pointercancel',cl)};
      const mv=ev=>{if(done)return;const dx=ev.clientX-sx,dy=ev.clientY-sy;
        if(ev.pointerType==='mouse'?Math.hypot(dx,dy)>6:(dy<-10&&-dy>Math.abs(dx))){
          done=1;cl();const r=st.getBoundingClientRect();
          const t=spawn(id,ev.clientX-r.left-30,ev.clientY-r.top-30);begin(t,ev,30,30)}};
      const upp=()=>{cl();if(!done){const t=spawn(id,40+Math.random()*(SW-140),60+Math.random()*(SH-160));t.style.transform='scale(1.15)';setTimeout(()=>t.style.transform='',160)}};
      addEventListener('pointermove',mv);addEventListener('pointerup',upp);addEventListener('pointercancel',cl);
    };
  });
}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.k;q='';$('#q').value='';shelfUI()}};
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase().replace(/\s+/g,'');shelfUI();if(!row.children.length)row.innerHTML='<div class="none">没有找到“'+e.target.value.trim()+'”</div>'};
function prog(){$('#prog').textContent='已发现 '+found.size+' / '+RL.length+' 种反应 · '+Object.values(SP).filter(s=>s.st!=='c').length+' 种物质'}
$('#clr').onclick=()=>{st.querySelectorAll('.tok').forEach(t=>t.remove());PT.length=0;$('#banner').classList.remove('on')};
$('#dex').onclick=()=>{
  $('#dh').textContent='反应图鉴 '+found.size+' / '+RL.length;
  $('#dl').innerHTML=[...found].sort((a,b)=>a-b).map(i=>'<p>'+RL[i].eq+'</p>').join('')||'<p>还没有发现，去试试吧。</p>';
  $('#dexp').hidden=false};
$('#dc').onclick=()=>$('#dexp').hidden=true;
shelfUI();prog();
</script>
